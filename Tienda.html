        function renderTienda() {
    const grid = document.getElementById('grid-tienda');
    const busqueda = document.getElementById('buscador').value.toLowerCase();
    
    const filtrados = catalogo.filter(p => p.visible !== false).filter(p => {
        const matchBusqueda = p.nombre.toLowerCase().includes(busqueda);
        const matchFiltro = filtroActual === 'todos' || p.cat === filtroActual;
        return matchBusqueda && matchFiltro;
    });

    grid.innerHTML = filtrados.map(p => {
        const esEspera = p.estado === 'espera';
        const esGratis = p.precio === 0 && !esEspera;
        
        // Nueva lógica para el aviso de cupos
        const mostrarAviso = p.cat === 'Grupales' && !esEspera && p.fechaInicio && p.fechaInicio !== "Por definir";
        
        const tagEdad = p.grupoEtario || p.grupoEdad;
        const tagEnfoque = p.enfoque;
        
        let infoFechasCupos = '';
        
        // Construcción de la info principal (Fecha, Horario, Duración, Modalidad y Aviso)
        if (p.cat === 'Grupales' || p.cat === 'Personalizados') {
            if (p.fechaInicio && !esEspera && p.fechaInicio !== "Por definir") {
                let cuposBarra = '';
                if (p.cuposTotales && p.cuposDisponibles) {
                    const porcentajeOcupado = ((p.cuposTotales - p.cuposDisponibles) / p.cuposTotales) * 100;
                    const colorCupos = p.cuposDisponibles <= 3 ? 'text-red-500' : 'text-[#8C8660]';
                    const bgBarra = p.cuposDisponibles <= 3 ? 'bg-red-500' : 'bg-[#8C8660]';
                    
                    cuposBarra = `
                        <div class="mt-3 bg-white p-2 rounded border border-gray-100">
                            <div class="flex justify-between items-center text-[10px] mb-1">
                                <span class="text-gray-500 font-medium">Cupos disponibles</span>
                                <span class="font-bold ${colorCupos}">${p.cuposDisponibles} de ${p.cuposTotales}</span>
                            </div>
                            <div class="w-full bg-gray-100 rounded-full h-1">
                                <div class="${bgBarra} h-1 rounded-full transition-all" style="width: ${porcentajeOcupado}%"></div>
                            </div>
                        </div>
                    `;
                }

                infoFechasCupos = `
                    <div class="mb-4 bg-gray-50 rounded-xl p-3 border border-gray-100">
                        <p class="text-[11px] text-gray-700 flex items-center gap-1.5 mb-1"><i class="ph ph-calendar-check text-[#8C8660] text-sm"></i> <b>Inicia:</b> ${p.fechaInicio}</p>
                        <p class="text-[11px] text-gray-700 flex items-center gap-1.5 mb-1"><i class="ph ph-clock text-[#8C8660] text-sm"></i> <b>Horario:</b> ${p.horario}</p>
                        ${p.duracion ? `<p class="text-[11px] text-gray-700 flex items-center gap-1.5 mb-1"><i class="ph ph-hourglass text-[#8C8660] text-sm"></i> <b>Duración:</b> ${p.duracion}</p>` : ''}
                        ${p.modalidad ? `<p class="text-[11px] text-gray-700 flex items-center gap-1.5 mb-1"><i class="ph ph-laptop text-[#8C8660] text-sm"></i> <b>Modalidad:</b> ${p.modalidad}</p>` : ''}
                        ${cuposBarra}
                        ${mostrarAviso ? `<div class="mt-2 pt-2 border-t border-gray-200 text-[10px] text-[#8C8660] font-bold italic flex items-center gap-1"><i class="ph ph-users text-sm"></i> Cupos limitados - Grupos pequeños</div>` : ''}
                    </div>
                `;
            } else if (p.fechaInicio === "Por definir" || esEspera) {
                infoFechasCupos = `
                    <div class="mb-4 flex items-center gap-2 text-amber-700 bg-amber-50 border border-amber-100 px-3 py-2 rounded-xl">
                        <i class="ph ph-calendar-blank text-base"></i> <span class="font-medium text-[11px] leading-tight">${esEspera ? 'Pronto abriremos fechas' : 'Pronto tendremos fechas disponibles'}</span>
                    </div>
                `;
            }
        } else if (p.duracion || p.sesiones) {
            infoFechasCupos = `<p class="text-[11px] font-medium text-gray-400 mb-4 flex items-center gap-1.5"><i class="ph ph-clock text-sm"></i> ${p.duracion || p.sesiones}</p>`;
        }

        let etiquetaInversion = (!esEspera && !esGratis) ? '<span class="text-[11px] text-gray-500 font-medium block mb-1 mt-2 uppercase tracking-wide">Inversión:</span>' : '';

        return `
        <div class="bg-white p-6 rounded-[24px] border border-gray-100 hover:border-[#8C8660]/30 hover:shadow-xl hover:-translate-y-1 transition-all duration-300 flex flex-col justify-between relative overflow-hidden group">
            <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-[#8C8660]/5 to-transparent rounded-bl-[100px] -z-10 transition-transform group-hover:scale-110"></div>
            <div>
                <div class="flex justify-between items-start mb-4 gap-2 flex-wrap">
                    <div class="flex gap-2 flex-wrap">
                        ${tagEdad ? `<span class="bg-gray-100 text-gray-700 text-[10px] font-bold px-3 py-1.5 rounded-full uppercase tracking-wider">${tagEdad}</span>` : ''}
                        ${tagEnfoque ? `<span class="text-[10px] font-bold text-[#8C8660] bg-[#8C8660]/10 px-3 py-1.5 rounded-full uppercase tracking-wider">${tagEnfoque}</span>` : ''}
                    </div>
                    ${esGratis ? '<span class="text-[10px] font-bold text-emerald-600 bg-emerald-50 border border-emerald-200 px-2 py-1 rounded-md shrink-0"><i class="ph ph-gift text-sm"></i></span>' : ''}
                </div>
                <h3 class="font-bold text-[#54463C] text-lg mt-2 mb-2 min-h-[3rem] line-clamp-2 leading-snug">${p.nombre}</h3>
                <p class="text-xs text-gray-500 mb-4 line-clamp-3 leading-relaxed">${p.desc || p.paraQuien || ''}</p>
                
                ${infoFechasCupos}
                ${etiquetaInversion}
                
                <div class="mt-auto pt-4 border-t border-gray-50">
                    ${p.precioFull && !esEspera ? `
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[11px] text-gray-400 line-through">Normal: $ ${p.precioFull.toLocaleString()}</span>
                        </div>
                    ` : ''}
                    <p class="text-[#8C8660] font-bold text-xl mb-6">
                        ${esEspera || p.fechaInicio === "Por definir" && p.precio === 0 ? '<span class="text-sm font-normal text-gray-400">Próximamente</span>' : (esGratis ? '¡GRATIS!' : '$ ' + p.precio.toLocaleString())}
                    </p>
                </div>
            </div>
            <div>
                <button onclick="verMas('${p.id}')" class="w-full bg-white text-[#8C8660] border-2 border-[#8C8660] py-3 rounded-xl font-bold text-sm hover:bg-[#8C8660] hover:text-white transition-all shadow-sm flex items-center justify-center gap-2">
                    <i class="ph ${esEspera ? 'ph-bell' : (esGratis ? 'ph-download-simple' : 'ph-eye')} text-lg"></i>
                    ${esEspera ? 'Solicitar apertura' : 'Ver Detalles'}
                </button>
            </div>
        </div>
        `;
    }).join('');
}
    
        function verMas(id) {
            // Aseguramos que el id cruce bien ya sea int o string
            const p = catalogo.find(x => String(x.id) === String(id));
            if (!p) return;

            const esEspera = p.estado === 'espera';
            const esGratis = p.precio === 0 && !esEspera;
            const esPorDefinir = p.fechaInicio === "Por definir";

            let btnText = (esEspera || esPorDefinir) ? 'Solicitar apertura' : (esGratis ? 'Solicitar Descarga' : 'Agregar al Carrito');
            let funcionClick = (esEspera || esPorDefinir) ? `solicitarApertura('${p.id}')` : `agregarAlCarrito('${p.id}')`;
            
            let precioNormalHtml = (p.precioFull && !esEspera && !esPorDefinir) ? `<p class="text-gray-400 line-through text-sm">Normal: $ ${p.precioFull.toLocaleString()}</p>` : '';
            
            let precioHtml;
            if (esEspera || esPorDefinir) {
                precioHtml = `<p class="text-gray-400 font-bold text-2xl mb-4">Próximamente</p>`;
            } else if (esGratis) {
                precioHtml = `<p class="text-[#8C8660] font-bold text-2xl mb-4">¡GRATIS!</p>`;
            } else {
                precioHtml = `
                    <p class="text-sm text-gray-600 mb-1 font-medium">Tu inversión por este programa es de:</p>
                    <p class="text-[#8C8660] font-bold text-2xl mb-4">Oferta: $ ${p.precio.toLocaleString()}</p>
                `;
            }

            let bloqueFechasModal = '';
            if (esEspera || esPorDefinir) {
                bloqueFechasModal = `
                    <div class="flex items-start gap-3 bg-amber-50 p-4 rounded-xl border border-amber-100 mb-4">
                        <div class="bg-white p-2 rounded-lg shadow-sm border border-amber-100"><i class="ph ph-bell text-xl text-amber-500"></i></div>
                        <div>
                            <p class="text-xs font-bold text-amber-600 uppercase tracking-wider mb-1">En espera</p>
                            <p class="text-amber-800 text-sm font-medium">Este taller aún no tiene fecha. ¡Solicita su apertura para ser el primero en enterarte!</p>
                        </div>
                    </div>
                `;
            } else if ((p.cat === 'Grupales' || p.cat === 'Personalizados') && p.fechaInicio) {
                let barraModal = '';
                if (p.cuposTotales && p.cuposDisponibles) {
                    const porcentajeOcupado = ((p.cuposTotales - p.cuposDisponibles) / p.cuposTotales) * 100;
                    const colorCupos = p.cuposDisponibles <= 3 ? 'text-red-600' : 'text-[#8C8660]';
                    const bgBarra = p.cuposDisponibles <= 3 ? 'bg-red-500' : 'bg-[#8C8660]';
                    
                    barraModal = `
                        <div class="bg-white border border-gray-200 rounded-lg p-3 mt-3 shadow-sm">
                            <div class="flex justify-between items-center text-xs mb-1.5">
                                <span class="text-gray-500 font-medium">Disponibilidad de cupos:</span>
                                <span class="font-bold ${colorCupos}">${p.cuposDisponibles} de ${p.cuposTotales} libres</span>
                            </div>
                            <div class="w-full bg-gray-100 rounded-full h-1.5">
                                <div class="${bgBarra} h-1.5 rounded-full transition-all" style="width: ${porcentajeOcupado}%"></div>
                            </div>
                        </div>
                    `;
                }
                bloqueFechasModal = `
                    <div class="flex items-start gap-3 bg-[#8C8660]/5 p-4 rounded-xl border border-[#8C8660]/20 mb-4">
                        <div class="bg-white p-2 rounded-lg shadow-sm"><i class="ph ph-calendar-check text-xl text-[#8C8660]"></i></div>
                        <div class="w-full">
                            <p class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Próximo inicio</p>
                            <p class="text-gray-800 text-sm font-bold">${p.fechaInicio}</p>
                            <p class="text-gray-600 text-sm mb-1">${p.horario}</p>
                            ${barraModal}
                        </div>
                    </div>
                `;
            }

            const modalContent = `
                <div class="flex justify-between items-start mb-6 border-b pb-4">
                    <div>
                        <h3 class="text-3xl font-bold text-gray-800 mb-3">${p.nombre}</h3>
                        <div class="flex gap-2">
                            <span class="bg-gray-100 text-gray-700 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">${p.grupoEtario || p.grupoEdad || p.cat}</span>
                            ${p.enfoque ? `<span class="bg-[#8C8660]/10 text-[#8C8660] text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">${p.enfoque}</span>` : ''}
                        </div>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-5 gap-8">
                    <div class="md:col-span-3 space-y-6">
                        ${p.desc ? `<div><h4 class="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2"><i class="ph ph-info text-[#8C8660]"></i> Descripción</h4><p class="text-gray-600 leading-relaxed">${p.desc}</p></div>` : ''}
                        
                        ${p.paraQuien ? `<div><h4 class="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2"><i class="ph ph-user text-[#8C8660]"></i> ¿Para quién es?</h4><p class="text-gray-600 leading-relaxed">${p.paraQuien}</p></div>` : ''}
                        
                        ${p.aprenderemos ? `<div><h4 class="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2"><i class="ph ph-brain text-[#8C8660]"></i> ¿Qué aprenderemos?</h4><p class="text-gray-600 leading-relaxed">${p.aprenderemos}</p></div>` : ''}
                        
                        ${p.lograremos ? `<div><h4 class="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2"><i class="ph ph-target text-[#8C8660]"></i> ¿Qué lograremos?</h4><p class="text-gray-600 leading-relaxed">${p.lograremos}</p></div>` : ''}
                        
                        ${p.metodologia ? `<div><h4 class="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2"><i class="ph ph-gear text-[#8C8660]"></i> Metodología</h4><p class="text-gray-600 leading-relaxed">${p.metodologia}</p></div>` : ''}
                        
                        ${p.incluye ? `<div><h4 class="text-lg font-bold text-gray-800 mb-2 flex items-center gap-2"><i class="ph ph-list-plus text-[#8C8660]"></i> ¿Qué incluye?</h4><ul class="list-disc pl-5 text-gray-600 space-y-1">${p.incluye.map(i => `<li>${i}</li>`).join('')}</ul></div>` : ''}
                    </div>
                    
                    <div class="md:col-span-2 bg-gray-50 rounded-2xl p-6 border border-gray-100 h-fit">
                        ${bloqueFechasModal}
                        
                        <div class="pt-6 border-t border-gray-200">
                            ${precioNormalHtml}
                            ${precioHtml}
                            <button onclick="${funcionClick}" 
                                class="w-full ${(esEspera || esPorDefinir) ? 'bg-amber-600' : 'bg-[#8C8660]'} text-white py-4 rounded-xl font-bold text-sm hover:opacity-90 transition shadow-md flex items-center justify-center gap-2">
                                <i class="ph ${(esEspera || esPorDefinir) ? 'ph-bell' : 'ph-shopping-cart-simple'} text-xl"></i>
                                ${btnText}
                            </button>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('contenido-detalle').innerHTML = modalContent;
            document.getElementById('modal-detalle').classList.remove('hidden');
        }

        function cerrarDetalle() { 
            document.getElementById('modal-detalle').classList.add('hidden'); 
        }

        function cambiarFiltro(cat) {
            filtroActual = cat;
            document.querySelectorAll('.category-pill').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(cat) || (cat === 'todos' && btn.innerText === 'Todos'));
            });
            renderTienda();
        }

        function inicializarTiendaConFiltro() {
            const urlParams = new URLSearchParams(window.location.search);
            const categoriaUrl = urlParams.get('cat');

            if (categoriaUrl) {
                cambiarFiltro(categoriaUrl);
            } else {
                renderTienda();
            }
        }

        function solicitarApertura(id) {
            const p = catalogo.find(x => String(x.id) === String(id));
            if (!p) return;

            const numeroWhatsApp = "573114951646"; 
            const mensaje = `Hola, tengo interés en el taller "${p.nombre}" y me gustaría ser avisado/a cuando abran nuevas fechas. ¿Me podrían dar más información?`;
            const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensaje)}`;
            
            window.open(url, '_blank');
        }

        function toggleCarrito(abrir = null) {
            const sidebar = document.getElementById('carrito-sidebar');
            if (abrir === true) sidebar.classList.remove('translate-x-full');
            else if (abrir === false) sidebar.classList.add('translate-x-full');
            else sidebar.classList.toggle('translate-x-full');
        }

        function agregarAlCarrito(id) {
            const p = catalogo.find(x => String(x.id) === String(id));
            
            let fechaTextoSeleccionada = p.duracion || p.sesiones || 'Recurso Inmediato / Sin Fecha';
            
            if (p.infoFecha) {
                if (p.infoFecha.tipo === 'personalizada') {
                    fechaTextoSeleccionada = p.infoFecha.texto;
                } else if (p.infoFecha.tipo === 'fijas' && p.infoFecha.opciones) {
                    const selector = document.getElementById('selector-fecha-fija');
                    if (selector) {
                        const opcion = p.infoFecha.opciones.find(o => o.idOpcion === selector.value);
                        if(opcion) fechaTextoSeleccionada = opcion.texto;
                    }
                }
            }

            const detallesFijos = `Mod: ${p.modalidad || 'N/A'} | Grupo: ${p.grupoEdad || p.grupoEtario || 'N/A'}`;

            const item = {
                cartId: Date.now(),
                nombre: p.nombre,
                precio: p.precio,
                precioFull: p.precioFull,
                fecha: fechaTextoSeleccionada,
                detalles: detallesFijos
            };

            carrito.push(item);
            actualizarCarritoUI();
            cerrarDetalle(); 
            toggleCarrito(true);
        }

        function eliminarDelCarrito(cartId) {
            carrito = carrito.filter(i => i.cartId !== cartId);
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const contenedor = document.getElementById('lista-items-carrito');
            const totalEtiq = document.getElementById('total-monto');
            const badge = document.getElementById('badge-carrito');
            
            const contenedorDesc = document.getElementById('contenedor-descuento');
            const descEtiq = document.getElementById('total-descuento');

            contenedor.innerHTML = '';
            let total = 0;
            let totalAhorro = 0; 

            carrito.forEach(item => {
                total += item.precio;
                
                if (item.precioFull && item.precioFull > item.precio) {
                    totalAhorro += (item.precioFull - item.precio);
                }

                contenedor.innerHTML += `
                    <div class="bg-gray-50 p-4 rounded-xl relative border border-gray-100 mb-3 hover:shadow-sm transition-shadow">
                        <button onclick="eliminarDelCarrito(${item.cartId})" class="absolute top-2 right-2 text-gray-400 hover:text-red-500 transition-colors p-1"><i class="ph ph-trash text-lg"></i></button>
                        <p class="font-bold text-sm pr-6 leading-tight text-[#54463C]">${item.nombre}</p>
                        <p class="text-xs text-[#8C8660] font-medium mt-1"><i class="ph ph-calendar-blank"></i> ${item.fecha}</p>
                        <p class="text-[10px] text-gray-400 mb-2">${item.detalles}</p>
                        
                        ${item.precioFull ? `
                            <div class="flex items-center gap-2 mt-1">
                                <span class="text-[10px] text-gray-400 line-through">$ ${item.precioFull.toLocaleString()}</span>
                                <p class="text-[#8C8660] font-bold text-sm">$ ${item.precio.toLocaleString()}</p>
                            </div>
                        ` : `
                            <p class="text-[#8C8660] font-bold text-sm mt-1">$ ${item.precio.toLocaleString()}</p>
                        `}
                    </div>
                `;
            });

            totalEtiq.innerText = `$ ${total.toLocaleString()}`;

            if (totalAhorro > 0) {
                descEtiq.innerText = `-$ ${totalAhorro.toLocaleString()}`;
                contenedorDesc.classList.remove('hidden');
            } else {
                contenedorDesc.classList.add('hidden');
            }

            if (carrito.length > 0) {
                badge.innerText = carrito.length;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
                contenedor.innerHTML = '<div class="flex flex-col items-center justify-center h-full text-gray-400 mt-10"><i class="ph ph-shopping-cart text-4xl mb-2"></i><p class="text-sm">Tu carrito está vacío</p></div>';
            }
        }

        function enviarPedidoWhatsApp() {
    if (carrito.length === 0) return alert("El carrito está vacío.");

    let total = 0;
    let totalAhorro = 0;
    let mensaje = "¡Hola! Quisiera reservar los siguientes programas en Psique Lab:%0A%0A";

    carrito.forEach((item, index) => {
        mensaje += `*${index + 1}. ${item.nombre}*%0A`;
        
        // --- AQUÍ ESTABA EL ERROR: Faltaba sumar el precio al total ---
        total += item.precio; 
        
        if(item.precioFull && item.precioFull > item.precio) {
            mensaje += `   Valor de oferta: $${item.precio.toLocaleString()} (Precio normal: $${item.precioFull.toLocaleString()})%0A`;
            totalAhorro += (item.precioFull - item.precio);
        } else {
            mensaje += `   Valor: $${item.precio.toLocaleString()}%0A`;
        }
    });

    mensaje += `*Inversión total estimada: $${total.toLocaleString()}*%0A`;
    
    if (totalAhorro > 0) {
        mensaje += `*🎉 Ahorro total en esta reserva: $${totalAhorro.toLocaleString()}*%0A%0A`;
    } else {
        mensaje += `%0A`;
    }
    
    mensaje += "Quedo atento(a) para coordinar fechas, horarios, el pago y confirmar mi cupo. ¡Gracias!";

    const numeroWhatsApp = "573114951646"; 
    const url = `https://wa.me/${numeroWhatsApp}?text=${mensaje}`;

    carrito = [];
    actualizarCarritoUI();
    toggleCarrito(false);

    window.open(url, '_blank');
}
        // Inicializamos la tienda apenas termine de cargar
        inicializarTiendaConFiltro();
    </script>

    <div id="carrito-sidebar" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl z-[300] transform translate-x-full transition-transform duration-300 border-l flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-[#FDFBFA]">
            <h3 class="font-bold text-xl flex items-center gap-2 text-[#54463C]"><i class="ph ph-shopping-bag"></i> Tus Selecciones</h3>
            <button onclick="toggleCarrito()" class="hover:bg-gray-100 p-2 rounded-full transition-colors"><i class="ph ph-x text-xl text-gray-500"></i></button>
        </div>
        <div id="lista-items-carrito" class="flex-1 overflow-y-auto p-6 custom-scrollbar space-y-4 bg-white">
            <!-- Items del carrito -->
        </div>
        <div class="p-6 border-t bg-[#FDFBFA]">
            <div id="contenedor-descuento" class="flex justify-between items-center font-medium text-sm text-emerald-600 bg-emerald-50 p-3 rounded-lg mb-4 hidden">
                <span class="flex items-center gap-2"><i class="ph ph-tag"></i> Tu ahorro total:</span>
                <span id="total-descuento" class="font-bold">-$ 0</span>
            </div>
            
            <div class="flex justify-between items-end font-bold text-lg mb-2 text-[#54463C]">
                <span>Inversión total:</span>
                <span id="total-monto" class="text-2xl text-[#8C8660]">$ 0</span>
            </div>
            <p class="text-xs text-gray-500 mb-6 text-center">Pagos habilitados a través de <b>Nequi</b> y <b>Daviplata</b>.</p>
            
            <button onclick="enviarPedidoWhatsApp()" class="w-full bg-[#25D366] text-white py-4 rounded-xl font-bold shadow-lg shadow-[#25D366]/20 hover:bg-[#128C7E] hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2">
                <i class="ph ph-whatsapp-logo text-xl"></i> Reservar vía WhatsApp
            </button>
        </div>
    </div>
